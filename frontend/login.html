<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MeetLog</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components .css">

<style>
.login-container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-card{
width:350px;
padding:30px;
border-radius:10px;
background:#111827;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.login-card h2{
text-align:center;
margin-bottom:20px;
}

.login-card input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:5px;
}

.login-card button{
width:100%;
padding:12px;
border:none;
background:#6366f1;
color:white;
cursor:pointer;
border-radius:5px;
}
</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<h2>Login</h2>

<form id="loginForm">

<input type="email" placeholder="Email" id="email" required>

<input type="password" placeholder="Password" id="password" required>

<button type="submit">Login</button>

</form>

</div>

</div>

<script src="js/login.js"></script>

</body>
</html>
